<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Books, notes, and other things collected by Yu-Chi Hou."
    />
    <meta name="theme-color" content="#f6f6f1" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("yu-theme");
          const systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches;
          document.documentElement.dataset.theme =
            savedTheme || (systemDark ? "dark" : "light");
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <title>Misc | Yu-Chi Hou</title>
    <link rel="icon" href="favicon.svg?v=4" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png?v=4" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=4" sizes="180x180" />
    <link rel="stylesheet" href="styles.css?v=20260809-21" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <div class="header-tools">
          <a
            class="brand"
            href="index.html"
            aria-label="Yu-Chi Hou home"
            title="Home"
          >
            <img
              src="apple-touch-icon.png?v=4"
              alt=""
              width="38"
              height="38"
            />
          </a>
          <button
            class="theme-toggle"
            type="button"
            title="Change theme"
            aria-label="Switch to dark mode"
            aria-pressed="false"
          >
            <span class="theme-toggle-icon" aria-hidden="true">☾</span>
          </button>
        </div>
        <nav aria-label="Primary navigation">
          <a href="index.html">Home</a>
          <a href="research.html">Research</a>
          <a href="activities.html">Activities</a>
          <a href="misc.html" aria-current="page">Misc</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="content-section" aria-label="Miscellaneous interests">
        <div class="research-groups misc-groups">
          <details class="research-group misc-group" open>
            <summary>Recently Read</summary>
            <div class="misc-group-body">
              <p>Completed books and short notes will appear here.</p>
            </div>
          </details>

          <details class="research-group misc-group">
            <summary>Recently Listened To</summary>
            <div class="misc-group-body"></div>
          </details>

          <details class="research-group misc-group">
            <summary>Recently Watched</summary>
            <div class="misc-group-body"></div>
          </details>

          <details class="research-group misc-group">
            <summary>Other Finds</summary>
            <div class="misc-group-body"></div>
          </details>
        </div>
      </section>
    </main>

    <script src="theme.js?v=20260809-6" defer></script>
    <script
      data-goatcounter="https://coryhou.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </body>
</html>
